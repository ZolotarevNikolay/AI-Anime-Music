<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: media:; media-src 'self' file: media: blob:; style-src 'self' 'unsafe-inline'; connect-src 'self';" />
  <title>AI Anime Music</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- ================= Боковое меню ================= -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo">♪</div>
        <div class="brand-name">AI Anime Music</div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item is-active" data-view="anime">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2.8" y="4.5" width="18.4" height="15" rx="2.4" /><path d="M8 4.5v15" />
              <path d="M12 9.5 16.5 8v5" /><circle cx="14.2" cy="12" r="1.4" />
            </svg>
          </span><span>Аниме</span>
        </button>
        <button class="nav-item" data-view="wave">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2.5 8.5c2.2-2.8 4.5-2.8 6.7 0s4.5 2.8 6.7 0 4.5-2.8 6.6 0" />
              <path d="M2.5 15.5c2.2-2.8 4.5-2.8 6.7 0s4.5 2.8 6.7 0 4.5-2.8 6.6 0" />
            </svg>
          </span><span>Моя волна</span>
        </button>
        <button class="nav-item" data-view="favorites">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20.2s-7.3-4.5-7.3-9.5A4.2 4.2 0 0 1 12 7.6a4.2 4.2 0 0 1 7.3 3.1c0 5-7.3 9.5-7.3 9.5Z" />
            </svg>
          </span><span>Моё любимое</span>
        </button>
        <button class="nav-item" data-view="playlists">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 6.5h16M4 12h16M4 17.5h9" />
            </svg>
          </span><span>Плейлисты</span>
        </button>
      </nav>

      <div class="sidebar-section">
        <div class="sidebar-title">
          <span>Мои плейлисты</span>
          <button class="icon-btn" id="btn-new-playlist" title="Создать плейлист">＋</button>
        </div>
        <div class="playlist-nav" id="playlist-nav"></div>
      </div>
    </aside>

    <!-- ================= Основная область ================= -->
    <main class="main">
      <header class="topbar">
        <div class="history-buttons">
          <button class="icon-btn" id="btn-back" title="Назад">‹</button>
          <button class="icon-btn" id="btn-forward" title="Вперёд">›</button>
        </div>
      </header>

      <div class="content" id="content">
        <section class="view" id="view" hidden></section>
      </div>
    </main>

    <!-- ================= Мини-плеер ================= -->
    <footer class="player" id="player">
      <div class="now-playing">
        <div class="np-cover" id="np-cover"><span>♪</span></div>
        <div class="np-info">
          <div class="np-title" id="np-title">Ничего не играет</div>
          <div class="np-artist" id="np-artist">Выберите трек</div>
        </div>
        <button class="icon-btn np-like" id="np-like" title="В любимое">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20.2s-7.3-4.5-7.3-9.5A4.2 4.2 0 0 1 12 7.6a4.2 4.2 0 0 1 7.3 3.1c0 5-7.3 9.5-7.3 9.5Z" />
          </svg>
        </button>
      </div>

      <div class="player-center">
        <div class="controls">
          <button class="icon-btn" id="btn-shuffle" title="Перемешать">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 6.5h3.5L16 17.5h4" /><path d="M16.5 14.5 20 17.5l-3.5 3" />
              <path d="M3 17.5h3.5L10 13" /><path d="M16.5 3.5 20 6.5l-3.5 3" /><path d="M20 6.5h-4L13 10" />
            </svg>
          </button>
          <button class="icon-btn" id="btn-prev" title="Предыдущий">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <rect x="4" y="5" width="2.2" height="14" rx="1" /><path d="M20 5.2v13.6L8.5 12z" />
            </svg>
          </button>
          <button class="play-btn" id="btn-play" title="Воспроизвести">
            <svg viewBox="0 0 24 24" fill="currentColor" id="play-icon"><path d="M7.5 4.2v15.6L19.5 12z" /></svg>
          </button>
          <button class="icon-btn" id="btn-next" title="Следующий">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <rect x="17.8" y="5" width="2.2" height="14" rx="1" /><path d="M4 5.2v13.6L15.5 12z" />
            </svg>
          </button>
          <button class="icon-btn" id="btn-repeat" title="Повтор">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M16.5 3 20 6.5 16.5 10" /><path d="M4 12V10a3.5 3.5 0 0 1 3.5-3.5H20" />
              <path d="M7.5 21 4 17.5 7.5 14" /><path d="M20 12v2a3.5 3.5 0 0 1-3.5 3.5H4" />
            </svg>
          </button>
        </div>

        <div class="progress">
          <span class="time" id="time-current">0:00</span>
          <input type="range" id="seek" min="0" max="1000" value="0" step="1" />
          <span class="time" id="time-total">0:00</span>
        </div>
      </div>

      <div class="player-right">
        <button class="icon-btn" id="btn-mute" title="Звук">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" id="volume-icon">
            <path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5H4Z" /><path d="M15.5 9a4 4 0 0 1 0 6" /><path d="M18 6.5a7.5 7.5 0 0 1 0 11" />
          </svg>
        </button>
        <input type="range" id="volume" min="0" max="100" value="80" step="1" />
        <button class="icon-btn" id="btn-queue" title="Очередь">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 6.5h12M4 11.5h12M4 16.5h7" /><path d="M19 9.5v9" /><circle cx="19" cy="18.5" r="2" /><path d="M16.5 11 22 9" />
          </svg>
        </button>
      </div>
    </footer>

    <!-- ================= Модальные окна ================= -->
    <div class="modal-overlay" id="modal-overlay" hidden>
      <div class="modal" id="modal">
        <h2 class="modal-title" id="modal-title">Новый плейлист</h2>
        <input type="text" id="modal-input" class="modal-input" placeholder="Название" />
        <div class="modal-actions">
          <button class="btn btn-ghost" id="modal-cancel">Отмена</button>
          <button class="btn btn-primary" id="modal-ok">Создать</button>
        </div>
      </div>
    </div>

    <!-- ================== Просмотр опенинга ================== -->
    <div class="modal-overlay video-overlay" id="video-overlay" hidden>
      <div class="modal video-modal">
        <h2 class="modal-title" id="video-title">Опенинг</h2>
        <video id="video-player" controls playsinline></video>
        <div class="modal-actions">
          <button class="btn btn-ghost" id="video-close">Закрыть</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast" hidden></div>
  </div>

  <audio id="audio" preload="metadata"></audio>
  <script src="renderer.js"></script>
</body>
</html>
